name: Evaluate Participant Submissions

on:
  push:
    paths:
      - "submission/**"
      - "evaluator/**"
      - "rubrics/**"
      - "assessment/problem_statements/**"
      - "requirements.txt"
      - ".github/workflows/evaluate-submissions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Identify changed submissions
        id: changed
        shell: bash
        run: |
          python scripts/find_submissions.py "${{ github.event.before || '' }}" "${{ github.sha }}" > changed_submissions.txt
          cat changed_submissions.txt
          if [ -s changed_submissions.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate submissions
        if: steps.changed.outputs.found == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m evaluator.run_evaluations --files-from changed_submissions.txt --output-dir evaluation-reports

      - name: Upload evaluation reports
        if: always() && steps.changed.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports-${{ github.run_number }}
          path: evaluation-reports/
          if-no-files-found: warn
          retention-days: 90
